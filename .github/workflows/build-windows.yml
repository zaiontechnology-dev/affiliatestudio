# Build do instalador Windows em runner oficial do GitHub (windows-latest).
# Só executa se o repositório for publicado no GitHub (ainda NÃO publicado — requer autorização do proprietário).
name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run dist:win
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release\SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: zaion-affiliate-studio-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
